name: Package downloadable alpha
on:
  push:
    paths: ['.github/workflows/packages.yml', 'tools/build_android.py', 'tools/build_windows.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: alpha-packages
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Android test signing identity
        uses: actions/cache@v4
        with:
          path: ~/.thronewars-signing
          key: thronewars-alpha-test-signing-v1
      - name: Install matching Godot and templates
        run: |
          curl --fail -L --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          curl --fail -L --retry 3 -o "$RUNNER_TEMP/templates.tpz" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p "$RUNNER_TEMP/templates"
          unzip -j -q "$RUNNER_TEMP/templates.tpz" 'templates/windows_release_x86_64.exe' 'templates/windows_debug_x86_64.exe' 'templates/android_debug.apk' 'templates/version.txt' -d "$RUNNER_TEMP/templates"
      - name: Verify source regressions
        run: python tools/test.py --godot "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --suite core
      - name: Build Windows and Android packages
        run: |
          python tools/build_windows.py --godot "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --templates "$RUNNER_TEMP/templates" --output build/windows
          python tools/build_android.py --godot "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --templates "$RUNNER_TEMP/templates" --sdk "$ANDROID_HOME" --java "$JAVA_HOME" --keystore "$HOME/.thronewars-signing/android-test.keystore" --output build/android
          mkdir -p build/downloads
          cp build/windows/*candidate.zip build/downloads/
          cp build/android/*test.apk build/downloads/
          cd build/downloads
          sha256sum *.zip *.apk > SHA256SUMS.txt
      - name: Publish explicit prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'import sys;sys.path.insert(0,"tools");from build_windows import VERSION;print(VERSION)')
          gh release create "v$VERSION" build/downloads/* --target "$GITHUB_SHA" --prerelease --title "Throne Wars $VERSION — Windows + Android test" --notes-file docs/RELEASE_ALPHA2.md
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: package-evidence
          path: |
            artifacts/validation/
            build/windows/*.log
            build/windows/*/manifest.json
            build/android/*.log
            build/android/manifest.json
